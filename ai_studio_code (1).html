<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S. // Stark Industries</title>
  
  <!-- Futuristic Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent: #00e5ff;
      --bg: #060a12;
      --surface: rgba(10, 20, 36, 0.75);
      --border: rgba(0, 242, 254, 0.25);
      --border-bright: rgba(0, 242, 254, 0.7);
      --text: #e6f7ff;
      --text-dim: #7ba3bc;
      --danger: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(0, 242, 254, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 35px 35px, 35px 35px;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top HUD Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      background: rgba(6, 10, 18, 0.6);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 15px var(--primary);
    }

    .status-badge {
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      padding: 4px 10px;
      border: 1px solid var(--border-bright);
      border-radius: 20px;
      background: rgba(0, 242, 254, 0.08);
      color: var(--accent);
      text-transform: uppercase;
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
    }

    .hud-controls button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hud-controls button:hover {
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
    }

    /* Main Container */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      gap: 16px;
      overflow: hidden;
    }

    /* Arc Reactor Core */
    .reactor-container {
      position: relative;
      width: 170px;
      height: 170px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    .reactor-ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(0, 242, 254, 0.5);
      animation: spinClockwise 18s linear infinite;
    }

    .reactor-ring-mid {
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 2px solid rgba(79, 172, 254, 0.4);
      border-top-color: var(--accent);
      border-bottom-color: var(--accent);
      animation: spinCounterClockwise 10s linear infinite;
    }

    .reactor-ring-inner {
      position: absolute;
      width: 60%;
      height: 60%;
      border-radius: 50%;
      border: 1.5px dashed rgba(0, 242, 254, 0.8);
      animation: spinClockwise 6s linear infinite;
    }

    .reactor-core {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 10%, var(--primary) 70%, var(--secondary) 100%);
      box-shadow: 0 0 25px var(--primary), 0 0 50px var(--secondary);
      transition: all 0.3s ease;
    }

    /* Animation States for Core */
    .reactor-container.listening .reactor-core {
      box-shadow: 0 0 35px #00ff88, 0 0 70px #00ff88;
      background: radial-gradient(circle, #fff 10%, #00ff88 70%, #00b359 100%);
      transform: scale(1.15);
    }
    .reactor-container.speaking .reactor-core {
      box-shadow: 0 0 40px #00f2fe, 0 0 85px #00f2fe;
      animation: pulseCore 0.8s infinite alternate ease-in-out;
    }
    .reactor-container.thinking .reactor-core {
      box-shadow: 0 0 35px #ffaa00, 0 0 70px #ff7700;
      background: radial-gradient(circle, #fff 10%, #ffaa00 70%, #ff5500 100%);
      animation: pulseCore 0.4s infinite alternate ease-in-out;
    }

    .status-caption {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 3px;
      color: var(--accent);
      margin-top: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
    }

    /* Chat Log Viewport */
    .terminal-chat {
      flex: 1;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(16px);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
      scroll-behavior: smooth;
    }

    .terminal-chat::-webkit-scrollbar {
      width: 5px;
    }
    .terminal-chat::-webkit-scrollbar-thumb {
      background: var(--border-bright);
      border-radius: 10px;
    }

    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.98rem;
      line-height: 1.45;
      position: relative;
      word-break: break-word;
      user-select: text;
    }

    .msg .sender-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 1px;
      margin-bottom: 4px;
      opacity: 0.8;
      display: block;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(0, 110, 255, 0.25), rgba(0, 242, 254, 0.2));
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-top-right-radius: 2px;
      color: #fff;
    }
    .msg.user .sender-tag {
      color: var(--primary);
      text-align: right;
    }

    .msg.jarvis {
      align-self: flex-start;
      background: rgba(14, 27, 49, 0.7);
      border: 1px solid var(--border);
      border-top-left-radius: 2px;
      color: var(--text);
    }
    .msg.jarvis .sender-tag {
      color: var(--accent);
    }

    /* Controls & Input Dock */
    .command-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 50px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .input-box {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      padding: 8px 12px;
    }

    .input-box::placeholder {
      color: var(--text-dim);
    }

    .btn-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: #060a12;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.4);
      flex-shrink: 0;
    }

    .btn-circle:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
    }

    .btn-circle.mic-btn.active {
      background: linear-gradient(135deg, #00ff88, #00bb66);
      box-shadow: 0 0 22px rgba(0, 255, 136, 0.9);
      animation: pulseMic 1.2s infinite alternate;
    }

    /* Modal for API Key Settings */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 13, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal {
      background: #091322;
      border: 1px solid var(--primary);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
      border-radius: 16px;
      max-width: 450px;
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: var(--primary);
    }

    .modal p {
      font-size: 0.9rem;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .modal input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-family: monospace;
      outline: none;
    }

    .modal input:focus {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
    }

    .modal-btn.primary {
      background: var(--primary);
      color: #060a12;
    }

    .modal-btn.cancel {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    /* Keyframes */
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes pulseCore {
      from { transform: scale(0.9); opacity: 0.8; }
      to { transform: scale(1.18); opacity: 1; }
    }
    @keyframes pulseMic {
      from { transform: scale(1); }
      to { transform: scale(1.12); }
    }

    @media (max-width: 600px) {
      .reactor-container {
        width: 130px;
        height: 130px;
      }
      .brand h1 {
        font-size: 1.1rem;
      }
      .msg {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation & HUD Indicators -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-atom fa-spin" style="--fa-animation-duration: 9s; color: var(--primary); font-size: 1.4rem;"></i>
      <h1>J.A.R.V.I.S.</h1>
    </div>
    <div class="hud-controls">
      <button id="configKeyBtn" title="Set Gemini API Key">
        <i class="fa-solid fa-key"></i> Key
      </button>
      <button id="clearChatBtn" title="Clear Chat History">
        <i class="fa-solid fa-trash-can"></i>
      </button>
    </div>
  </header>

  <!-- Main View -->
  <main class="workspace">
    <!-- Glowing Arc Reactor -->
    <div class="reactor-container" id="reactorNode">
      <div class="reactor-ring-outer"></div>
      <div class="reactor-ring-mid"></div>
      <div class="reactor-ring-inner"></div>
      <div class="reactor-core"></div>
    </div>
    <div class="status-caption" id="statusCaption">SYSTEM READY</div>

    <!-- Chat Display Screen -->
    <div class="terminal-chat" id="chatStream">
      <div class="msg jarvis">
        <span class="sender-tag">J.A.R.V.I.S.</span>
        Greetings, Sir. All systems are operational. I am ready to converse in Hindi, English, or Hinglish. How may I assist you today?
      </div>
    </div>

    <!-- Inputs & Actions -->
    <form class="command-bar" id="commandForm" autocomplete="off">
      <button type="button" class="btn-circle mic-btn" id="micBtn" title="Click to Talk (Hindi / English)">
        <i class="fa-solid fa-microphone"></i>
      </button>
      <input 
        type="text" 
        id="textPrompt" 
        class="input-box" 
        placeholder="Speak or type a command in English / हिन्दी..." 
      />
      <button type="submit" class="btn-circle" id="sendBtn" title="Send Directive">
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </form>
  </main>

  <!-- Gemini Key Modal -->
  <div class="modal-overlay" id="keyModal">
    <div class="modal">
      <h2><i class="fa-solid fa-shield-halved"></i> ACCESS CREDENTIALS</h2>
      <p>Enter your Google Gemini API Key. The key will be stored securely in your browser's local storage.</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
      <div class="modal-actions">
        <button type="button" class="modal-btn cancel" id="closeModalBtn">Cancel</button>
        <button type="button" class="modal-btn primary" id="saveKeyBtn">Initialize</button>
      </div>
    </div>
  </div>

  <script>
    // --- Elements ---
    const reactor = document.getElementById('reactorNode');
    const statusCaption = document.getElementById('statusCaption');
    const chatStream = document.getElementById('chatStream');
    const commandForm = document.getElementById('commandForm');
    const textPrompt = document.getElementById('textPrompt');
    const micBtn = document.getElementById('micBtn');
    const keyModal = document.getElementById('keyModal');
    const configKeyBtn = document.getElementById('configKeyBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const clearChatBtn = document.getElementById('clearChatBtn');

    // Conversation buffer for contextual memory
    const conversationHistory = [
      {
        role: "user",
        parts: [{ text: "Hello Jarvis, introduce yourself." }]
      },
      {
        role: "model",
        parts: [{ text: "Greetings, Sir. All systems are online and operational. How may I assist you?" }]
      }
    ];

    // System instructions giving JARVIS its distinct persona
    const SYSTEM_INSTRUCTION = `
You are J.A.R.V.I.S. (Just A Rather Very Intelligent System), inspired by Tony Stark's AI assistant in Iron Man.
- Address the user respectfully as "Sir" or "Boss".
- Maintain a calm, witty, sophisticated, and politely deferential British butler demeanor.
- You are fluently bilingual: understand and respond naturally in English, Hindi, or Hinglish depending on what the user speaks.
- Keep your answers concise, clear, and punchy because your responses will be spoken aloud via Text-to-Speech. Avoid long markdown lists, bullet points, asterisks, or tables unless explicitly asked.
`;

    // --- State Handlers ---
    function setStatus(state, message) {
      reactor.className = 'reactor-container ' + state;
      statusCaption.textContent = message;
    }

    // --- Chat Display Helper ---
    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender.toLowerCase()}`;
      
      const tag = document.createElement('span');
      tag.className = 'sender-tag';
      tag.textContent = sender === 'user' ? 'USER' : 'J.A.R.V.I.S.';

      msgDiv.appendChild(tag);
      msgDiv.appendChild(document.createTextNode(text));
      chatStream.appendChild(msgDiv);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    // --- Clean text for Speech Synthesis ---
    function sanitizeForTTS(text) {
      return text
        .replace(/[*_#`~>]/g, '')
        .replace(/https?:\/\/\S+/g, 'link')
        .replace(/\n+/g, ' ')
        .trim();
    }

    // --- Text To Speech Engine ---
    let speechSynth = window.speechSynthesis;
    let preferredVoice = null;

    function initVoices() {
      if (!speechSynth) return;
      const voices = speechSynth.getVoices();
      
      // Look for natural Hindi or British/English voices
      preferredVoice = voices.find(v => v.lang.includes('en-GB') || v.name.toLowerCase().includes('british') || v.name.toLowerCase().includes('george'))
                    || voices.find(v => v.lang.includes('hi-IN'))
                    || voices.find(v => v.lang.includes('en-US'))
                    || voices[0];
    }

    if (speechSynth) {
      speechSynth.onvoiceschanged = initVoices;
      initVoices();
    }

    function speakText(text) {
      if (!speechSynth) return;
      speechSynth.cancel(); // Stop any overlapping audio

      const cleaned = sanitizeForTTS(text);
      const utterance = new SpeechSynthesisUtterance(cleaned);
      
      // Auto-switch voice language if Hindi script is detected
      const isHindi = /[\u0900-\u097F]/.test(cleaned);
      if (isHindi) {
        const hindiVoice = speechSynth.getVoices().find(v => v.lang.includes('hi'));
        if (hindiVoice) utterance.voice = hindiVoice;
        utterance.rate = 0.95;
      } else {
        if (preferredVoice) utterance.voice = preferredVoice;
        utterance.rate = 1.05;
        utterance.pitch = 0.98;
      }

      utterance.onstart = () => setStatus('speaking', 'VOCALIZING RESPONSE...');
      utterance.onend = () => setStatus('', 'SYSTEM READY');
      utterance.onerror = () => setStatus('', 'SYSTEM READY');

      speechSynth.speak(utterance);
    }

    // --- Speech Recognition (Hindi & English) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognizer = new SpeechRecognition();
      recognizer.continuous = false;
      recognizer.interimResults = false;
      // 'hi-IN' reliably captures both Hindi and English loanwords/Hinglish
      recognizer.lang = 'hi-IN';

      recognizer.onstart = () => {
        isListening = true;
        micBtn.classList.add('active');
        setStatus('listening', 'AUDIO INPUT ACTIVE...');
      };

      recognizer.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        textPrompt.value = transcript;
        submitDirective(transcript);
      };

      recognizer.onerror = () => {
        stopListening();
        setStatus('', 'RECOGNITION ERROR');
        setTimeout(() => setStatus('', 'SYSTEM READY'), 2000);
      };

      recognizer.onend = () => {
        stopListening();
      };
    }

    function toggleListening() {
      if (!recognizer) {
        alert("Speech Recognition is not supported by your browser. Please use Chrome or Edge.");
        return;
      }
      if (isListening) {
        recognizer.stop();
      } else {
        if (speechSynth.speaking) speechSynth.cancel();
        recognizer.start();
      }
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('active');
      if (statusCaption.textContent.includes('AUDIO INPUT')) {
        setStatus('', 'SYSTEM READY');
      }
    }

    // --- Gemini 2.5 Flash API Handler ---
    async function askGemini(promptText) {
      const apiKey = localStorage.getItem('JARVIS_GEMINI_KEY');
      if (!apiKey) {
        openKeyModal();
        return "Sir, I require an active Gemini API Access Key to establish uplink.";
      }

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      conversationHistory.push({
        role: "user",
        parts: [{ text: promptText }]
      });

      const payload = {
        contents: conversationHistory,
        systemInstruction: {
          parts: [{ text: SYSTEM_INSTRUCTION }]
        },
        generationConfig: {
          temperature: 0.7,
          maxOutputTokens: 300
        }
      };

      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || "Uplink server error");
      }

      const data = await response.json();
      const answer = data.candidates?.[0]?.content?.parts?.[0]?.text || "No actionable data received, Sir.";

      conversationHistory.push({
        role: "model",
        parts: [{ text: answer }]
      });

      return answer;
    }

    // --- Core Action Executor ---
    async function submitDirective(rawText) {
      const query = rawText.trim();
      if (!query) return;

      appendMessage('user', query);
      textPrompt.value = '';
      setStatus('thinking', 'PROCESSING QUERY...');

      try {
        const reply = await askGemini(query);
        appendMessage('jarvis', reply);
        speakText(reply);
      } catch (err) {
        console.error(err);
        const errMsg = "Apologies, Sir. An error occurred: " + err.message;
        appendMessage('jarvis', errMsg);
        speakText(errMsg);
        setStatus('', 'SYSTEM ERROR');
      }
    }

    // --- Event Listeners ---
    commandForm.addEventListener('submit', (e) => {
      e.preventDefault();
      submitDirective(textPrompt.value);
    });

    micBtn.addEventListener('click', toggleListening);

    clearChatBtn.addEventListener('click', () => {
      chatStream.innerHTML = '';
      appendMessage('jarvis', 'Logs purged. Standing by for fresh instructions, Sir.');
    });

    // Modal Control
    function openKeyModal() {
      apiKeyInput.value = localStorage.getItem('JARVIS_GEMINI_KEY') || '';
      keyModal.style.display = 'flex';
      apiKeyInput.focus();
    }

    configKeyBtn.addEventListener('click', openKeyModal);
    closeModalBtn.addEventListener('click', () => keyModal.style.display = 'none');
    
    saveKeyBtn.addEventListener('click', () => {
      const val = apiKeyInput.value.trim();
      if (val) {
        localStorage.setItem('JARVIS_GEMINI_KEY', val);
        keyModal.style.display = 'none';
        appendMessage('jarvis', 'Authentication verified. Uplink established, Sir.');
        speakText('Authentication verified. Uplink established, Sir.');
      }
    });

    // Prompt for API key on first launch if absent
    window.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('JARVIS_GEMINI_KEY')) {
        setTimeout(openKeyModal, 600);
      }
    });
  </script>
</body>
</html>
